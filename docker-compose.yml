name: quantum-circuit-generation

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
      MAX_QUBITS: ${MAX_QUBITS:-8}
      MAX_SHOTS: ${MAX_SHOTS:-10000}
      SHOTS: ${SHOTS:-1000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-4000}
      MAX_GATES: ${MAX_GATES:-128}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-10}
      PDF_VISION_PAGES: ${PDF_VISION_PAGES:-3}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-6000}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-true}
      HISTORY_DATABASE_PATH: ${HISTORY_DATABASE_PATH:-/tmp/qcg-history.db}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  # Offline PyTorch experiments. The profile keeps it out of `docker compose up`.
  # Run with: docker compose run --rm research train
  # It reuses the backend build, so its layers come from the backend's cache.
  research:
    profiles: ["research"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Runs and datasets are bind-mounted, so write them as the host user (Linux default uid 1000).
    user: "${RESEARCH_UID:-1000}:${RESEARCH_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./backend/research/runs:/app/research/runs
      - ./backend/research/data:/app/research/data
      - ./backend/research/configs:/app/research/configs:ro
    entrypoint: ["python", "-m", "research"]
    command: ["--help"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
